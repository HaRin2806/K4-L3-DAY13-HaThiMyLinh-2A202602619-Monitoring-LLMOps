alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602619
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602619
    runbook: docs/alerts.md#alert-2
  - name: DailyCostSpike
    severity: warning
    condition: total_cost_usd > 2.5
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602619
    runbook: docs/alerts.md#alert-3
